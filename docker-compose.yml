# Optional local/full-stack compose.
# In Dokploy homolog, prefer TWO separate apps (web + api) — see apps/api/README.md.
# This compose is only for when both services share dokploy-network AND you want
# a single stack; the frontend nginx does NOT depend on hostname "api".

services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3002"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: "3002"
      CORS_ORIGIN: ${CORS_ORIGIN}
      DRIVE_FOLDER_ID: ${DRIVE_FOLDER_ID}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${GOOGLE_OAUTH_REFRESH_TOKEN:-}
      ALLOW_OAUTH_SETUP: ${ALLOW_OAUTH_SETUP:-false}
    networks:
      - dokploy-network

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://lavi-samuel-backend-sbzxln-cdf361-177-7-39-127.sslip.io}
    restart: unless-stopped
    ports:
      - "80"
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
