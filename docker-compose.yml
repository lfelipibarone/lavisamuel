services:
  web:
    build: .
    restart: unless-stopped
    # Publish container port 80 without binding host :80 (Traefik owns host 80).
    # In Dokploy Domains: Service = web, Port = 80
    ports:
      - "80"
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
